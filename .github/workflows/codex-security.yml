name: Codex Security

on:
  pull_request:

concurrency:
  group: codex-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    name: Codex Security (advisory)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write

    steps:
      - name: Determine scan scope
        id: scope
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          should_scan=false
          changed_files="$RUNNER_TEMP/codex-security-pr-files.txt"
          gh api \
            --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' > "$changed_files"

          while IFS= read -r path; do
            case "$path" in
              .github/*|docs/*|*.md|*.markdown)
                ;;
              *)
                should_scan=true
                break
                ;;
            esac
          done < "$changed_files"
          echo "should_scan=$should_scan" >> "$GITHUB_OUTPUT"

      - name: Record documentation-only skip
        if: steps.scope.outcome == 'success' && steps.scope.outputs.should_scan != 'true'
        run: |
          echo "### Codex Security" >> "$GITHUB_STEP_SUMMARY"
          echo "Skipped: this pull request only changes documentation or GitHub metadata excluded from the scanner's diff inventory." >> "$GITHUB_STEP_SUMMARY"

      # Install the trusted scanner before checking out pull-request-controlled files.
      - name: Set up Node.js
        id: setup-node
        if: steps.scope.outputs.should_scan == 'true'
        continue-on-error: true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"

      - name: Set up Python
        id: setup-python
        if: steps.scope.outputs.should_scan == 'true'
        continue-on-error: true
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Read trusted Codex Security pin
        id: pin
        if: steps.scope.outputs.should_scan == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PIN_FILE: .github/codex-security-version
        run: |
          set -euo pipefail
          pinned="$(
            gh api \
              -H "Accept: application/vnd.github.raw+json" \
              "repos/$GITHUB_REPOSITORY/contents/$PIN_FILE?ref=$BASE_SHA"
          )"
          if ! [[ "$pinned" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The trusted Codex Security pin is invalid: $pinned" >&2
            exit 1
          fi
          echo "CODEX_SECURITY_VERSION=$pinned" >> "$GITHUB_ENV"

      - name: Install Codex Security
        id: install
        if: steps.scope.outputs.should_scan == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          npm install \
            --prefix "$RUNNER_TEMP/codex-security" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            "@openai/codex-security@$CODEX_SECURITY_VERSION"

      - name: Verify Codex Security
        id: verify
        if: steps.scope.outputs.should_scan == 'true'
        continue-on-error: true
        env:
          CODEX_SECURITY_BIN: ${{ runner.temp }}/codex-security/node_modules/.bin/codex-security
        run: |
          set -euo pipefail
          test -x "$CODEX_SECURITY_BIN"
          actual="$("$CODEX_SECURITY_BIN" --version)"
          if test "$actual" != "$CODEX_SECURITY_VERSION"; then
            echo "Expected Codex Security $CODEX_SECURITY_VERSION, received $actual." >&2
            exit 1
          fi

      - name: Check out the pull request
        id: checkout
        if: steps.scope.outputs.should_scan == 'true'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Determine supported scan inventory
        id: inventory
        if: steps.scope.outputs.should_scan == 'true'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INVENTORY_FILE: ${{ runner.temp }}/codex-security-rank-input.jsonl
          INVENTORY_HELPER: ${{ runner.temp }}/codex-security/node_modules/@openai/codex-security/_bundled_plugin/scripts/generate_rank_input.py
        run: |
          set -euo pipefail
          BASE_REVISION="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          python "$INVENTORY_HELPER" make-diff-rank-input \
            --repo "$GITHUB_WORKSPACE" \
            --base "$BASE_REVISION" \
            --mode revisions \
            --head "$HEAD_SHA" \
            --out "$INVENTORY_FILE"

          if test -s "$INVENTORY_FILE"; then
            count="$(wc -l < "$INVENTORY_FILE")"
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
            echo "Codex Security review inventory: $count source-like file(s)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_scan=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record unsupported-only skip
        if: steps.inventory.outcome == 'success' && steps.inventory.outputs.should_scan != 'true'
        run: |
          echo "### Codex Security" >> "$GITHUB_STEP_SUMMARY"
          echo "Skipped: the pull request has no source-like files in Codex Security's deterministic diff inventory." >> "$GITHUB_STEP_SUMMARY"

      - name: Scan the pull request
        id: scan
        if: steps.inventory.outputs.should_scan == 'true'
        continue-on-error: true
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_SECURITY_API_KEY }}
          CODEX_SECURITY_BIN: ${{ runner.temp }}/codex-security/node_modules/.bin/codex-security
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SCAN_DIR: ${{ runner.temp }}/codex-security-results
        run: |
          set -euo pipefail
          if test -z "${CODEX_API_KEY:-}"; then
            echo "Set the CODEX_SECURITY_API_KEY repository or organization secret." >&2
            exit 1
          fi
          BASE_REVISION="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          "$CODEX_SECURITY_BIN" scan . \
            --auth api-key \
            --mode standard \
            --model gpt-5.6-terra \
            --codex 'model_reasoning_effort="high"' \
            --diff "$BASE_REVISION" \
            --head "$HEAD_SHA" \
            --output-dir "$SCAN_DIR" \
            --json > "$RUNNER_TEMP/codex-security.json"

      - name: Export SARIF
        id: export-sarif
        if: always() && steps.inventory.outputs.should_scan == 'true'
        continue-on-error: true
        env:
          CODEX_SECURITY_BIN: ${{ runner.temp }}/codex-security/node_modules/.bin/codex-security
          SCAN_DIR: ${{ runner.temp }}/codex-security-results
          SARIF_FILE: ${{ runner.temp }}/codex-security.sarif
        run: |
          set -euo pipefail
          if test -f "$SCAN_DIR/scan-manifest.json"; then
            "$CODEX_SECURITY_BIN" export "$SCAN_DIR" \
              --export-format sarif \
              --source-root "$GITHUB_WORKSPACE" \
              --output "$SARIF_FILE"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF
        id: upload-sarif
        if: always() && steps.export-sarif.outputs.available == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: ${{ runner.temp }}/codex-security.sarif
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          sha: ${{ github.event.pull_request.head.sha }}
          category: codex-security

      - name: Preserve scan results
        id: preserve-results
        if: always() && steps.inventory.outputs.should_scan == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codex-security-results
          path: |
            ${{ runner.temp }}/codex-security-results
            ${{ runner.temp }}/codex-security.json
          if-no-files-found: warn
          retention-days: 7

      - name: Create advisory result
        id: advisory-result
        if: always()
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
          SHOULD_SCAN_SCOPE: ${{ steps.scope.outputs.should_scan }}
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          SHOULD_SCAN_INVENTORY: ${{ steps.inventory.outputs.should_scan }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          EXPORT_SARIF_OUTCOME: ${{ steps.export-sarif.outcome }}
          SARIF_AVAILABLE: ${{ steps.export-sarif.outputs.available }}
          SARIF_UPLOAD_OUTCOME: ${{ steps.upload-sarif.outcome }}
          SARIF_FILE: ${{ runner.temp }}/codex-security.sarif
          ADVISORY_DIR: ${{ runner.temp }}/codex-security-advisory
        run: |
          set -euo pipefail
          status=unavailable
          detail=scan_unavailable
          message="The advisory scanner did not complete, so no security conclusion was produced."
          findings_count=""

          if test "$SCOPE_OUTCOME" != "success"; then
            detail=scope_failed
            message="The workflow could not determine the pull request scan scope."
          elif test "$SHOULD_SCAN_SCOPE" != "true"; then
            status=clean
            detail=documentation_only
            message="No scan was required because the pull request only changes excluded documentation or GitHub metadata."
            findings_count=0
          elif test "$INVENTORY_OUTCOME" != "success"; then
            detail=inventory_failed
            message="The workflow could not build the supported source-file inventory."
          elif test "$SHOULD_SCAN_INVENTORY" != "true"; then
            status=clean
            detail=unsupported_only
            message="No scan was required because the pull request has no supported source-like files."
            findings_count=0
          elif test "$SCAN_OUTCOME" != "success"; then
            detail=scan_failed
            message="The advisory scanner failed, so no security conclusion was produced."
          elif test "$EXPORT_SARIF_OUTCOME" != "success" || test "$SARIF_AVAILABLE" != "true" || ! test -f "$SARIF_FILE"; then
            detail=sarif_unavailable
            message="The scan completed, but its SARIF result could not be exported."
          elif findings_count="$(jq '[.runs[]?.results[]?] | length' "$SARIF_FILE" 2>/dev/null)"; then
            detail=scan_complete
            if test "$findings_count" -gt 0; then
              status=findings
              message="The advisory scanner reported $findings_count potential finding(s)."
            else
              status=clean
              message="The advisory scanner reported no findings."
            fi
          else
            detail=sarif_invalid
            message="The scan completed, but its SARIF result could not be parsed."
            findings_count=""
          fi

          mkdir -p "$ADVISORY_DIR"
          jq -n \
            --arg status "$status" \
            --arg detail "$detail" \
            --arg message "$message" \
            --arg head_sha "$HEAD_SHA" \
            --arg run_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg sarif_upload_outcome "${SARIF_UPLOAD_OUTCOME:-skipped}" \
            --arg findings_count "$findings_count" \
            --argjson pr_number "$PR_NUMBER" \
            '{
              schema_version: 1,
              status: $status,
              detail: $detail,
              message: $message,
              findings_count: (if $findings_count == "" then null else ($findings_count | tonumber) end),
              pr_number: $pr_number,
              head_sha: $head_sha,
              run_url: $run_url,
              sarif_upload_outcome: $sarif_upload_outcome
            }' > "$ADVISORY_DIR/advisory-result.json"

          {
            echo "### Codex Security advisory"
            echo
            echo "**Status:** $status"
            echo
            echo "$message"
            if test "$SARIF_UPLOAD_OUTCOME" = "failure"; then
              echo
              echo "SARIF publishing also failed; inspect the workflow log and preserved scan artifact."
            fi
            echo
            echo "This scan is advisory and is not a required merge gate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload advisory result
        id: upload-advisory-result
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codex-security-advisory
          path: ${{ runner.temp }}/codex-security-advisory/advisory-result.json
          if-no-files-found: warn
          retention-days: 7

      - name: Complete advisory check
        if: always()
        env:
          RESULT_OUTCOME: ${{ steps.advisory-result.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-advisory-result.outcome }}
        run: |
          if test "$RESULT_OUTCOME" != "success" || test "$UPLOAD_OUTCOME" != "success"; then
            {
              echo
              echo "The normalized advisory result could not be published. This operational failure does not block merging."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
