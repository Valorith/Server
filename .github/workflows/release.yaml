name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Release type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      draft:
        description: Create the GitHub release as a draft
        required: true
        type: boolean
        default: false
      notify_discord:
        description: Send a Discord notification for non-draft releases
        required: true
        type: boolean
        default: true
      confirm:
        description: Type "release" to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-release
  cancel-in-progress: false

env:
  RELEASE_BRANCH: master

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_sha: ${{ steps.publish.outputs.release_sha }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0
          submodules: recursive

      - name: Validate manual release request
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "release" ]; then
            echo "Confirmation input must exactly equal 'release'."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/${RELEASE_BRANCH}" ]; then
            echo "Release workflow must be run from ${RELEASE_BRANCH}; current ref is ${GITHUB_REF}."
            exit 1
          fi

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute and apply release version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest_tag="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -z "$latest_tag" ]; then
            package_version="$(python3 -c 'import json; print(json.load(open("package.json", encoding="utf-8"))["version"])')"
            latest_tag="v${package_version}"
          fi

          version="$(python3 utils/scripts/release/release_version.py compute --latest-tag "$latest_tag" --bump "$BUMP")"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists."
            exit 1
          fi

          python3 utils/scripts/release/release_version.py set --version "$version" --channel release

          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Commit release version and tag
        id: publish
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json common/version.h CMakeLists.txt; then
            echo "No release version changes were produced."
            exit 1
          fi

          git add package.json common/version.h CMakeLists.txt
          git commit -m "chore(release): ${TAG}"

          release_sha="$(git rev-parse HEAD)"
          git push origin HEAD:${RELEASE_BRANCH}

          echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"

  restore-dev-version:
    name: Restore Dev Version
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore dev version on release branch
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          python3 utils/scripts/release/release_version.py set --version "$VERSION" --channel dev

          if git diff --quiet -- common/version.h; then
            echo "CURRENT_VERSION already has the expected dev suffix."
            exit 0
          fi

          git add common/version.h
          git commit -m "chore(release): restore ${VERSION}-dev"

          for attempt in 1 2 3; do
            if git push origin HEAD:${RELEASE_BRANCH}; then
              exit 0
            fi

            echo "Dev version push failed on attempt ${attempt}; rebasing onto origin/${RELEASE_BRANCH} and retrying."
            git fetch origin "${RELEASE_BRANCH}"
            git rebase "origin/${RELEASE_BRANCH}"
            sleep "$attempt"
          done

          echo "Failed to push dev version restore commit after 3 attempts."
          exit 1

  build-linux:
    name: Build Linux
    needs: prepare-release
    runs-on: ubuntu-latest
    container:
      image: akkadius/eqemu-server:v16
      options: --user 0
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Mark workspace safe
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-release-ccache-${{ hashFiles('CMakeLists.txt', '.github/workflows/release.yaml') }}
          restore-keys: |
            ${{ runner.os }}-release-ccache-

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: ${{ runner.os }}-release-vcpkg-${{ hashFiles('vcpkg.json', 'submodules/vcpkg/scripts/vcpkg-tool-metadata.txt') }}
          restore-keys: |
            ${{ runner.os }}-release-vcpkg-
            ${{ runner.os }}-vcpkg-

      - name: Configure vcpkg binary cache
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.vcpkg-binary-cache"
          echo "VCPKG_BINARY_SOURCES=clear;files,$GITHUB_WORKSPACE/.vcpkg-binary-cache,readwrite" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential ninja-build ccache uuid-dev zip unzip python3 patchelf

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DEQEMU_BUILD_TESTS=ON \
            -DEQEMU_BUILD_LOGIN=ON \
            -DEQEMU_BUILD_LUA=ON \
            -DEQEMU_BUILD_PERL=ON \
            -DEQEMU_BUILD_CLIENT_FILES=ON

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Test
        shell: bash
        working-directory: build
        run: ./bin/tests

      - name: Package binaries
        shell: bash
        run: |
          bash utils/scripts/release/package-linux.sh \
            "${{ needs.prepare-release.outputs.version }}" \
            "${{ needs.prepare-release.outputs.tag }}" \
            "${{ needs.prepare-release.outputs.release_sha }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eqemu-server-linux-x64
          path: dist/eqemu-server-linux-x64-${{ needs.prepare-release.outputs.tag }}.zip
          retention-days: 90

  build-windows:
    name: Build Windows
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Enable long paths
        run: git config --global core.longpaths true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: ${{ runner.os }}-release-vcpkg-${{ hashFiles('vcpkg.json', 'submodules/vcpkg/scripts/vcpkg-tool-metadata.txt') }}
          restore-keys: |
            ${{ runner.os }}-release-vcpkg-
            ${{ runner.os }}-vcpkg-

      - name: Configure vcpkg binary cache
        shell: pwsh
        run: |
          $cachePath = Join-Path $env:GITHUB_WORKSPACE ".vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $cachePath | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$cachePath,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install officially-supported Strawberry Perl (5.24)
        shell: pwsh
        run: |
          $version = "5.24.4.1"
          $url = "https://strawberryperl.com/download/$version/strawberry-perl-$version-64bit-portable.zip"
          $zip = Join-Path $env:RUNNER_TEMP "strawberry-$version.zip"
          $dest = "C:\Strawberry-5.24"
          Write-Host "Installing Strawberry Perl $version (the supported EQEmu Windows Perl)"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          # perl.exe's MinGW runtime (e.g. libgcc_s_seh-1.dll) can live in c\bin; copy it
          # next to perl.exe so FindPerl can run perl during configure WITHOUT putting the
          # MinGW toolchain (gcc/g++) on PATH, which would derail the MSVC/Ninja build.
          foreach ($d in 'libgcc_s_seh-1.dll', 'libstdc++-6.dll', 'libwinpthread-1.dll') {
            if (Test-Path "$dest\c\bin\$d") { Copy-Item "$dest\c\bin\$d" "$dest\perl\bin\" -Force }
          }
          # Put 5.24 ahead of the runner's default Strawberry so FindPerl links perl524.dll.
          "$dest\perl\site\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$dest\perl\bin"      | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $perlExe = "$dest\perl\bin\perl.exe".Replace('\', '/')
          "PERL_524_EXE=$perlExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & "$dest\perl\bin\perl.exe" -e "printf qq{Linking against Strawberry Perl %vd\n}, $^V"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DPERL_EXECUTABLE="$env:PERL_524_EXE" `
            -DEQEMU_BUILD_TESTS=ON `
            -DEQEMU_BUILD_LOGIN=ON `
            -DEQEMU_BUILD_LUA=ON `
            -DEQEMU_BUILD_ZLIB=ON `
            -DEQEMU_BUILD_PERL=ON `
            -DEQEMU_BUILD_CLIENT_FILES=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel

      - name: Test
        shell: pwsh
        working-directory: build
        run: ./bin/tests.exe

      - name: Package binaries
        shell: pwsh
        run: |
          ./utils/scripts/release/package-windows.ps1 `
            -Version "${{ needs.prepare-release.outputs.version }}" `
            -Tag "${{ needs.prepare-release.outputs.tag }}" `
            -CommitSha "${{ needs.prepare-release.outputs.release_sha }}"

      - name: Smoke test drop-in package
        shell: pwsh
        run: |
          ./utils/scripts/release/smoke-windows-dropin.ps1 `
            -PackageZip "dist/eqemu-server-windows-x64-${{ needs.prepare-release.outputs.tag }}.zip" `
            -PerlBinDir "C:\Strawberry-5.24\perl\bin" `
            -MariaDbPluginRoot "build\vcpkg_installed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eqemu-server-windows-x64
          path: dist/eqemu-server-windows-x64-${{ needs.prepare-release.outputs.tag }}.zip
          retention-days: 90

  release:
    name: Create Release
    needs: [prepare-release, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: eqemu-server-linux-x64
          path: artifacts/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: eqemu-server-windows-x64
          path: artifacts/

      - name: List artifacts
        shell: bash
        run: ls -la artifacts/

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          target_commitish: ${{ needs.prepare-release.outputs.release_sha }}
          name: Release ${{ needs.prepare-release.outputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/eqemu-server-linux-x64-${{ needs.prepare-release.outputs.tag }}.zip
            artifacts/eqemu-server-windows-x64-${{ needs.prepare-release.outputs.tag }}.zip
            artifacts/SHA256SUMS.txt

      - name: Notify Discord
        if: ${{ inputs.notify_discord && !inputs.draft }}
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          DISCORD_WEBHOOK_URL="${DISCORD_RELEASE_WEBHOOK_URL:-${DISCORD_WEBHOOK_URL:-}}"
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "No Discord webhook secret is set; skipping Discord notification."
            exit 0
          fi

          LINUX_ASSET="eqemu-server-linux-x64-${TAG_NAME}.zip"
          WINDOWS_ASSET="eqemu-server-windows-x64-${TAG_NAME}.zip"
          LINUX_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/${LINUX_ASSET}"
          WINDOWS_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/${WINDOWS_ASSET}"
          SHA_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/SHA256SUMS.txt"
          payload=$(jq -n \
            --arg tag "$TAG_NAME" \
            --arg repo "$REPO" \
            --arg linux "$LINUX_URL" \
            --arg windows "$WINDOWS_URL" \
            --arg sha "$SHA_URL" \
            --arg footer "Clumsy's World EQEmu Release" \
            '{
              embeds: [
                {
                  title: ("Release " + $tag),
                  url: ("https://github.com/" + $repo + "/releases/tag/" + $tag),
                  color: 5793266,
                  thumbnail: { url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" },
                  fields: [
                    { name: "Linux (x64)", value: ("[Download](" + $linux + ")"), inline: true },
                    { name: "Windows (x64)", value: ("[Download](" + $windows + ")"), inline: true },
                    { name: "Checksums", value: ("[SHA256SUMS.txt](" + $sha + ")"), inline: false }
                  ],
                  footer: { text: $footer }
                }
              ]
            }')
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          http_code=$(curl -sS -o "$response_file" -w "%{http_code}" \
            -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL")
          curl_status=$?
          if [ $curl_status -ne 0 ]; then
            echo "Failed to send Discord notification (curl exit $curl_status)."
            exit 0
          fi
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Discord notification failed with HTTP $http_code: $(cat "$response_file")"
            echo "Continuing without failing the release job."
          fi
