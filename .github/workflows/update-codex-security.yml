name: Update Codex Security

on:
  schedule:
    - cron: "23 10 * * 1"
  workflow_dispatch:

concurrency:
  group: update-codex-security
  cancel-in-progress: false

jobs:
  validate:
    name: Check and validate latest release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      update_available: ${{ steps.version.outputs.update_available }}
      pinned: ${{ steps.version.outputs.pinned }}
      latest: ${{ steps.version.outputs.latest }}

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"

      - name: Check published version
        id: version
        env:
          PIN_FILE: .github/codex-security-version
        run: |
          set -euo pipefail
          pinned="$(tr -d '\r\n' < "$PIN_FILE")"
          latest="$(npm view @openai/codex-security version)"

          if ! [[ "$pinned" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not determine the pinned Codex Security version." >&2
            exit 1
          fi
          if ! [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The npm registry returned an unexpected version: $latest" >&2
            exit 1
          fi

          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if test "$pinned" = "$latest"; then
            echo "update_available=false" >> "$GITHUB_OUTPUT"
            echo "Codex Security is current at $pinned." >> "$GITHUB_STEP_SUMMARY"
          else
            highest="$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -n 1)"
            if test "$highest" != "$latest"; then
              echo "Refusing to replace $pinned with older registry version $latest." >&2
              exit 1
            fi
            echo "update_available=true" >> "$GITHUB_OUTPUT"
            echo "Codex Security update available: $pinned -> $latest" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Python
        if: steps.version.outputs.update_available == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install and preflight the candidate
        if: steps.version.outputs.update_available == 'true'
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/codex-security-candidate"
          scan_root="$RUNNER_TEMP/codex-security-preflight"
          npm install \
            --prefix "$install_root" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            "@openai/codex-security@$LATEST"

          scanner="$install_root/node_modules/.bin/codex-security"
          actual="$("$scanner" --version)"
          if test "$actual" != "$LATEST"; then
            echo "Expected Codex Security $LATEST, received $actual." >&2
            exit 1
          fi

          inventory_helper="$install_root/node_modules/@openai/codex-security/_bundled_plugin/scripts/generate_rank_input.py"
          inventory_file="$RUNNER_TEMP/codex-security-rank-input.jsonl"
          test -f "$inventory_helper"
          python "$inventory_helper" make-diff-rank-input \
            --repo "$GITHUB_WORKSPACE" \
            --base HEAD \
            --mode revisions \
            --head HEAD \
            --out "$inventory_file"

          "$scanner" scan "$GITHUB_WORKSPACE" \
            --diff HEAD \
            --head HEAD \
            --mode standard \
            --model gpt-5.6-terra \
            --codex 'model_reasoning_effort="high"' \
            --output-dir "$scan_root" \
            --dry-run \
            --json

  create-update-pr:
    name: Open update pull request
    needs: validate
    if: needs.validate.outputs.update_available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update the pinned version
        env:
          LATEST: ${{ needs.validate.outputs.latest }}
          PINNED: ${{ needs.validate.outputs.pinned }}
          PIN_FILE: .github/codex-security-version
        run: |
          set -euo pipefail
          current="$(tr -d '\r\n' < "$PIN_FILE")"
          if test "$current" != "$PINNED"; then
            echo "Expected pin $PINNED, found $current." >&2
            exit 1
          fi
          printf '%s\n' "$LATEST" > "$PIN_FILE"
          test "$(tr -d '\r\n' < "$PIN_FILE")" = "$LATEST"
          git diff --check

      - name: Create pull request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.validate.outputs.latest }}
          PINNED: ${{ needs.validate.outputs.pinned }}
        run: |
          set -euo pipefail
          branch="automation/codex-security-$LATEST"
          existing="$(
            gh api \
              --method GET \
              "repos/$GITHUB_REPOSITORY/pulls" \
              -f state=open \
              -f head="$GITHUB_REPOSITORY_OWNER:$branch" \
              --jq '.[0].number // empty'
          )"
          if test -n "$existing"; then
            echo "Update pull request #$existing is already open." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Remote branch $branch exists without an open pull request." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add .github/codex-security-version
          git commit -m "chore(ci): update Codex Security to $LATEST"
          git push --set-upstream origin "$branch"

          url="$(
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title "chore(ci): update Codex Security to $LATEST" \
              --body "Updates the pinned Codex Security CLI from $PINNED to $LATEST. The candidate package was installed with lifecycle scripts disabled and passed the CLI dry-run preflight in a read-only job."
          )"
          echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
