name: Build
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  metadata:
    name: Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Check binary database versions
        run: python3 utils/scripts/release/release_version.py check-db-versions

  # Check if we should skip this workflow run (e.g., if the same code already built successfully)
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          # Skip if a successful run exists for the same tree hash (same file content)
          skip_after_successful_duplicate: 'true'
          # Never skip PR builds - we always want to see status before merge
          do_not_skip: '["pull_request"]'

  linux:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    name: Linux
    runs-on: ubuntu-latest
    container:
      image: akkadius/eqemu-server:v16
      # Run as root to avoid EACCES on GitHub Actions runner file command writes in the container.
      options: --user 0
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', '.github/workflows/build.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'submodules/vcpkg/scripts/vcpkg-tool-metadata.txt') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Configure vcpkg binary cache
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.vcpkg-binary-cache"
          echo "VCPKG_BINARY_SOURCES=clear;files,$GITHUB_WORKSPACE/.vcpkg-binary-cache,readwrite" >> "$GITHUB_ENV"

      - name: Ensure ccache installed
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            echo "ccache not found in container; installing."
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ccache
            command -v ccache >/dev/null 2>&1 || { echo "ccache install failed"; exit 1; }
          fi

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        working-directory: ${{ github.workspace }}
        run: |
          cmake -S . -B build -G Ninja \
            -DEQEMU_BUILD_TESTS=ON \
            -DEQEMU_BUILD_LOGIN=ON \
            -DEQEMU_BUILD_LUA=ON \
            -DEQEMU_BUILD_PERL=ON \
            -DEQEMU_BUILD_CLIENT_FILES=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel

      - name: Test
        working-directory: ${{ github.workspace }}/build
        run: ./bin/tests

  windows:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Enable long paths
        run: git config --global core.longpaths true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compute Windows cache keys
        id: windows-cache
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $manifestHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "vcpkg.json").Hash.ToLowerInvariant()
          $metadataPath = if ($env:VCPKG_ROOT) { Join-Path $env:VCPKG_ROOT "scripts\vcpkg-tool-metadata.txt" } else { $null }
          if ($metadataPath -and (Test-Path -LiteralPath $metadataPath)) {
            $vcpkgMetadataHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $metadataPath).Hash.ToLowerInvariant()
          } else {
            $vcpkgMetadataHash = "no-vcpkg-metadata"
          }

          $image = if ($env:ImageOS) { $env:ImageOS } else { "unknown-image" }
          $vsVersion = if ($env:VisualStudioVersion) { $env:VisualStudioVersion } else { "unknown-vs" }
          $vcToolsVersion = if ($env:VCToolsVersion) { $env:VCToolsVersion } else { "unknown-vctools" }
          $ucrtVersion = if ($env:UCRTVersion) { $env:UCRTVersion } else { "unknown-ucrt" }
          $runnerOs = if ($env:RUNNER_OS) { $env:RUNNER_OS } else { "Windows" }
          $keyPrefix = "$runnerOs-vcpkg-msvc-v2-$image-vs$vsVersion-vc$vcToolsVersion-ucrt$ucrtVersion"

          "vcpkg-key=$keyPrefix-$manifestHash-$vcpkgMetadataHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "vcpkg-restore-prefix=$keyPrefix-" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: ${{ steps.windows-cache.outputs.vcpkg-key }}
          restore-keys: |
            ${{ steps.windows-cache.outputs.vcpkg-restore-prefix }}
            ${{ runner.os }}-vcpkg-msvc-v2-

      - name: Configure vcpkg binary cache
        shell: pwsh
        run: |
          $cachePath = Join-Path $env:GITHUB_WORKSPACE ".vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $cachePath | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$cachePath,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore Strawberry Perl cache
        id: strawberry-perl-cache
        uses: actions/cache@v4
        with:
          path: C:\Strawberry-5.24
          key: ${{ runner.os }}-strawberry-perl-5.24.4.1-v1

      - name: Install officially-supported Strawberry Perl (5.24)
        if: steps.strawberry-perl-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = "5.24.4.1"
          $url = "https://strawberryperl.com/download/$version/strawberry-perl-$version-64bit-portable.zip"
          $zip = Join-Path $env:RUNNER_TEMP "strawberry-$version.zip"
          $dest = "C:\Strawberry-5.24"
          Write-Host "Installing Strawberry Perl $version (the supported EQEmu Windows Perl)"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force

      - name: Configure Strawberry Perl
        shell: pwsh
        run: |
          $dest = "C:\Strawberry-5.24"
          if (-not (Test-Path "$dest\perl\bin\perl.exe")) {
            throw "Strawberry Perl was not found at $dest."
          }
          # perl.exe's MinGW runtime (e.g. libgcc_s_seh-1.dll) can live in c\bin; copy it
          # next to perl.exe so FindPerl can run perl during configure WITHOUT putting the
          # MinGW toolchain (gcc/g++) on PATH, which would derail the MSVC/Ninja build.
          foreach ($d in 'libgcc_s_seh-1.dll', 'libstdc++-6.dll', 'libwinpthread-1.dll') {
            if (Test-Path "$dest\c\bin\$d") { Copy-Item "$dest\c\bin\$d" "$dest\perl\bin\" -Force }
          }
          "$dest\perl\site\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$dest\perl\bin"      | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $perlExe = "$dest\perl\bin\perl.exe".Replace('\', '/')
          "PERL_524_EXE=$perlExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & "$dest\perl\bin\perl.exe" -e "printf qq{Linking against Strawberry Perl %vd\n}, $^V"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DPERL_EXECUTABLE="$env:PERL_524_EXE" `
            -DEQEMU_BUILD_TESTS=ON `
            -DEQEMU_BUILD_LOGIN=ON `
            -DEQEMU_BUILD_LUA=ON `
            -DEQEMU_BUILD_ZLIB=ON `
            -DEQEMU_BUILD_CLIENT_FILES=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ./bin/tests.exe
