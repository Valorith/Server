name: Build
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  # Check if we should skip this workflow run (e.g., if the same code already built successfully)
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          # Skip if a successful run exists for the same tree hash (same file content)
          skip_after_successful_duplicate: 'true'
          # Never skip PR builds - we always want to see status before merge
          do_not_skip: '["pull_request"]'

  linux:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    name: Linux
    runs-on: ubuntu-latest
    container:
      image: akkadius/eqemu-server:v16
      # Run as root to avoid EACCES on GitHub Actions runner file command writes in the container.
      options: --user 0
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', '.github/workflows/build.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'submodules/vcpkg/scripts/vcpkg-tool-metadata.txt') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Configure vcpkg binary cache
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.vcpkg-binary-cache"
          echo "VCPKG_BINARY_SOURCES=clear;files,$GITHUB_WORKSPACE/.vcpkg-binary-cache,readwrite" >> "$GITHUB_ENV"

      - name: Ensure ccache installed
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            echo "ccache not found in container; installing."
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ccache
            command -v ccache >/dev/null 2>&1 || { echo "ccache install failed"; exit 1; }
          fi

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        working-directory: ${{ github.workspace }}
        run: |
          cmake -S . -B build -G Ninja \
            -DEQEMU_BUILD_TESTS=ON \
            -DEQEMU_BUILD_LOGIN=ON \
            -DEQEMU_BUILD_LUA=ON \
            -DEQEMU_BUILD_PERL=ON \
            -DEQEMU_BUILD_CLIENT_FILES=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel

      - name: Test
        working-directory: ${{ github.workspace }}/build
        run: ./bin/tests

  windows:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Enable long paths
        run: git config --global core.longpaths true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'submodules/vcpkg/scripts/vcpkg-tool-metadata.txt') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Configure vcpkg binary cache
        shell: pwsh
        run: |
          $cachePath = Join-Path $env:GITHUB_WORKSPACE ".vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $cachePath | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$cachePath,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DEQEMU_BUILD_TESTS=ON `
            -DEQEMU_BUILD_LOGIN=ON `
            -DEQEMU_BUILD_LUA=ON `
            -DEQEMU_BUILD_ZLIB=ON `
            -DEQEMU_BUILD_CLIENT_FILES=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config RelWithDebInfo --target ALL_BUILD -- /m

      - name: Test
        working-directory: build
        run: ./bin/RelWithDebInfo/tests.exe
